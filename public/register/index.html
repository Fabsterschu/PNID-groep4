<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - TropoMetrics</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/css/stylesheet.css">
    <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Limelight&family=Press+Start+2P&display=swap" rel="stylesheet">

</head>
<body>
    <div class="Wrapper">
        <div id="Title">
            <h1>TropoMetrics</h1>
            <img src="/images/skyGame.jpg" aalt="skyGame" class="titel-afbeelding">
        </div>
            <form id="registerForm">
                <input type="username" id="usernameInput" placeholder="Username" required>
                <input type="email" id="emailInput" placeholder="Email" required>
                <input type="password" id="passwordInput" placeholder="Password" required>
                <input type="submit" value="Registreer">
            </form>
            <p id="errorMessage"></p>
            <a href="/login/">login</a>
        </div>
    </div>
    <script src="/js/register.js"></script>
</body>

</html>
